name: 毎週更新とカレンダー公開

on:
  schedule:
    # Sunday 00:17 UTC = Sunday 09:17 Asia/Tokyo.
    - cron: '17 0 * * 0'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calendar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install parser
        run: pip install -r requirements.txt
      - name: Check date handling
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/calendar.test.mjs
          node --check dist/app.js
      - name: Refresh from official articles
        run: python scripts/update_events.py
      - name: Save checked calendar data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update seminar dates from official articles'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish calendar
        id: deployment
        uses: actions/deploy-pages@v4
